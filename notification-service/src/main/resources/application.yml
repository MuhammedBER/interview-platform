spring:
  application:
    name: notification-service
  datasource:
    url: ${APP_NOTIFICATION_DATASOURCE_URL}
    username: ${APP_NOTIFICATION_DATASOURCE_USERNAME}
    password: ${APP_NOTIFICATION_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          default_schema: notification
      open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  mail:
    host: ${APP_MAIL_HOST:mailhog}
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@interview-platform.local}
server.port: 8082
