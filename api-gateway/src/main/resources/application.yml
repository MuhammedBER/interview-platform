server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            routes:
                - id: interview-service
                  uri: http://localhost:8081
                  predicates:
                      - Path=/api/**
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8180/realms/interview-platform
origin-url: http://localhost:5173