server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: interview-service
          uri: ${APP_INTERVIEW_SERVICE_URI}
          predicates:
            - Path=/api/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN}