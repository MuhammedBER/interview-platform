server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: let react-router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML so a freshly built bundle is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hash-fingerprinted assets are immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
