name: interview-platform
services:
  postgres:
    image: postgres:16
    container_name: interview-platform-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: interview-platform-mailhog
    ports:
      - 8025:8025
      - 1025:1025

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: interview-platform-keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - 8180:8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.7.0
    container_name: interview-platform-kafka
    ports:
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: interview-platform-api-gateway
    ports:
      - 8080:8080
    environment:
      APP_KEYCLOAK_ISSUER_URI: ${APP_KEYCLOAK_ISSUER_URI}
      APP_KEYCLOAK_JWK_SET_URI: ${APP_KEYCLOAK_JWK_SET_URI}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
      APP_INTERVIEW_SERVICE_URI: ${APP_INTERVIEW_SERVICE_URI}
    depends_on:
      keycloak:
        condition: service_healthy
      interview-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  interview-service:
    build:
      context: .
      dockerfile: interview-service/Dockerfile
    container_name: interview-platform-interview-service
    ports:
      - 8081:8081
    environment:
      APP_KEYCLOAK_ISSUER_URI: ${APP_KEYCLOAK_ISSUER_URI}
      APP_KEYCLOAK_JWK_SET_URI: ${APP_KEYCLOAK_JWK_SET_URI}
      APP_DATASOURCE_URL: ${APP_DATASOURCE_URL}
      APP_DATASOURCE_USERNAME: ${APP_DATASOURCE_USERNAME}
      APP_DATASOURCE_PASSWORD: ${APP_DATASOURCE_PASSWORD}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && echo -e 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: interview-platform-notification-service
    ports:
      - 8082:8082
    environment:
      APP_NOTIFICATION_DATASOURCE_URL: ${APP_NOTIFICATION_DATASOURCE_URL}
      APP_NOTIFICATION_DATASOURCE_USERNAME: ${APP_NOTIFICATION_DATASOURCE_USERNAME}
      APP_NOTIFICATION_DATASOURCE_PASSWORD: ${APP_NOTIFICATION_DATASOURCE_PASSWORD}
      APP_MAIL_HOST: ${APP_MAIL_HOST}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && echo -e 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:8080}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8180}
    container_name: interview-platform-frontend
    ports:
      - 3000:80
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data: